<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="assets/vendor/gsap.min.js"></script>
<style id="local-fonts">
      /* 本地字体子集 — 由 tools/build-fonts-local.py 生成，不要手改。
         只包含片子里出现过的字符；变量字体的 wght 轴保留，所以每个家族一个文件。 */
      @font-face {
        font-family: 'Noto Sans SC';
        src: url('assets/fonts/NotoSansSC-subset.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Noto Serif SC';
        src: url('assets/fonts/NotoSerifSC-subset.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('assets/fonts/JetBrainsMono-subset.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
    </style>
    <style>
      [data-composition-id='beat-3-proof'] {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
        --serif: 'Noto Serif SC', 'Songti SC', serif;
        --sans: 'Noto Sans SC', -apple-system, sans-serif;
        --mono: 'JetBrains Mono', 'SF Mono', monospace;
      }
      [data-composition-id='beat-3-proof'] .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      [data-composition-id='beat-3-proof'] .backdrop {
        position: absolute;
        inset: 0;
        background-color: #162520;
      }

      /* ── 左右两半：各自裁切一张真实界面截图 ───────────────────── */
      [data-composition-id='beat-3-proof'] .half {
        position: absolute;
        top: 0;
        width: 960px;
        height: 1080px;
        overflow: hidden;
        background: #162520;
      }
      [data-composition-id='beat-3-proof'] .half-left {
        left: 0;
        clip-path: inset(0 100% 0 0);
      }
      [data-composition-id='beat-3-proof'] .half-right {
        left: 960px;
        clip-path: inset(0 0 0 100%);
      }
      [data-composition-id='beat-3-proof'] .pan {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
      }
      [data-composition-id='beat-3-proof'] .half-left .pan {
        left: -80px;
        top: -140px;
      }
      [data-composition-id='beat-3-proof'] .half-right .pan {
        left: -820px;
        top: -140px;
      }
      [data-composition-id='beat-3-proof'] .shot {
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        display: block;
      }

      /* 两半各自的压暗层，避免截图比叠加文字更亮 */
      [data-composition-id='beat-3-proof'] .veil {
        position: absolute;
        inset: 0;
        background: rgba(22, 37, 32, 0.34);
      }
      [data-composition-id='beat-3-proof'] .half-right .veil {
        background: rgba(22, 37, 32, 0.42);
      }

      /* ── 角标（放在读数条里，避免和截图自带的标题打架）──────────── */
      [data-composition-id='beat-3-proof'] .kicker {
        font-family: var(--mono);
        font-size: 16px;
        letter-spacing: 0.2em;
        color: #95a39b;
        margin-bottom: 10px;
      }

      /* ── 中央分割线 ───────────────────────────────────────────── */
      [data-composition-id='beat-3-proof'] .divider {
        position: absolute;
        left: 959px;
        top: 0;
        width: 2px;
        height: 1080px;
        background: #44615a;
        transform-origin: center center;
        z-index: 6;
      }
      [data-composition-id='beat-3-proof'] .divider-node {
        position: absolute;
        left: 953px;
        top: 528px;
        width: 14px;
        height: 14px;
        border: 2px solid #c5d4af;
        border-radius: 50%;
        background: #162520;
        z-index: 7;
      }

      /* ── 下三分之一：读数条 ───────────────────────────────────── */
      [data-composition-id='beat-3-proof'] .lower {
        position: absolute;
        left: 0;
        top: 826px;
        width: 1920px;
        height: 254px;
        background: rgba(22, 37, 32, 0.93);
        border-top: 1px solid #2a3d38;
        z-index: 8;
      }
      [data-composition-id='beat-3-proof'] .lower-left {
        position: absolute;
        left: 64px;
        top: 24px;
      }
      [data-composition-id='beat-3-proof'] .lower-right {
        position: absolute;
        left: 1024px;
        top: 24px;
      }
      [data-composition-id='beat-3-proof'] .metric-label {
        font-family: var(--sans);
        font-size: 20px;
        color: #a8b5ac;
      }
      [data-composition-id='beat-3-proof'] .metric-row {
        margin-top: 10px;
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      [data-composition-id='beat-3-proof'] .metric-big {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 56px;
        line-height: 1;
        color: #c5d4af;
        font-variant-numeric: tabular-nums;
      }
      [data-composition-id='beat-3-proof'] .metric-big-warm {
        color: #f0cb76;
      }
      [data-composition-id='beat-3-proof'] .metric-arrow {
        font-family: var(--mono);
        font-size: 30px;
        color: #6f8c5c;
      }
      [data-composition-id='beat-3-proof'] .metric-note {
        margin-top: 12px;
        font-family: var(--sans);
        font-size: 19px;
        color: #95a39b;
      }
      [data-composition-id='beat-3-proof'] .delta-chip {
        position: absolute;
        left: 1540px;
        top: 86px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 12px 18px;
        border: 1px solid #6f8c5c;
        border-radius: 4px;
        background: rgba(160, 183, 133, 0.14);
      }
      [data-composition-id='beat-3-proof'] .delta-num {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 38px;
        line-height: 1;
        color: #c5d4af;
        font-variant-numeric: tabular-nums;
      }
      [data-composition-id='beat-3-proof'] .delta-text {
        font-family: var(--sans);
        font-size: 20px;
        color: #e8e4d8;
      }
      [data-composition-id='beat-3-proof'] .latency {
        position: absolute;
        right: 64px;
        top: 28px;
        font-family: var(--mono);
        font-size: 17px;
        letter-spacing: 0.16em;
        color: #c5d4af;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="beat-3-proof" data-start="0" data-width="1920" data-height="1080">
      <div id="b3-scene" class="scene">
        <div id="b3-backdrop" class="backdrop"></div>

        <div id="b3-half-left" class="half half-left">
          <div id="b3-pan-left" class="pan">
            <img id="b3-img-left" class="shot" src="shots/02-shap.png" alt="SHAP 归因看板" />
          </div>
          <div class="veil"></div>
        </div>
        <div id="b3-half-right" class="half half-right">
          <div id="b3-pan-right" class="pan">
            <img id="b3-img-right" class="shot" src="shots/03-scenario.png" alt="参数情景模拟" />
          </div>
          <div class="veil"></div>
        </div>

        <div id="b3-divider" class="divider"></div>
        <div id="b3-divider-node" class="divider-node"></div>

        <div id="b3-lower" class="lower">
          <div class="lower-left">
            <div id="b3-tag-left" class="kicker">M02 · SHAP ATTRIBUTION DASHBOARD</div>
            <div class="metric-label">河南省 · 省内因子重要性均值</div>
            <div class="metric-row">
              <span id="b3-metric-main" class="metric-big metric-big-warm">89.6%</span>
              <span class="metric-note" style="margin-top: 0">化肥施用量</span>
            </div>
            <div class="metric-note">灌溉率 4.9% · 洪涝占比 4.9% · 其余 8 个因子合计 0.6%</div>
          </div>

          <div class="lower-right">
            <div id="b3-tag-right" class="kicker">M03 · COUNTERFACTUAL SCENARIO</div>
            <div class="metric-label">青海 · 基线风险 → 模拟风险</div>
            <div class="metric-row">
              <span id="b3-metric-base" class="metric-big">0.0400</span>
              <span class="metric-arrow">→</span>
              <span id="b3-metric-sim" class="metric-big metric-big-warm">0.0225</span>
            </div>
            <div class="metric-note">灌溉率上调至 28%，其余参数保持基线</div>
          </div>

          <div id="b3-delta" class="delta-chip">
            <span class="delta-num">−43.7%</span>
            <span class="delta-text">风险下降</span>
          </div>
          <div id="b3-latency" class="latency">INFERENCE &lt; 2s</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // 入场一律 fromTo：渲染器非线性 seek，from 会被重置回初始态
        tl.fromTo('#b3-backdrop', { opacity: 0 }, { opacity: 1, duration: 0.34, ease: 'power2.out' }, 0);
        tl.fromTo(
          '#b3-half-left',
          { clipPath: 'inset(0 100% 0 0)' },
          { clipPath: 'inset(0 0% 0 0)', duration: 0.55, ease: 'expo.out' },
          0.06,
        );
        tl.fromTo(
          '#b3-half-right',
          { clipPath: 'inset(0 0 0 100%)' },
          { clipPath: 'inset(0 0% 0 0)', duration: 0.55, ease: 'expo.out' },
          0.14,
        );
        tl.fromTo('#b3-divider', { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: 'power2.out' }, 0.18);
        tl.fromTo(
          '#b3-divider-node',
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2.2)' },
          0.44,
        );
        tl.fromTo('#b3-tag-left', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 0.4);
        tl.fromTo('#b3-tag-right', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 0.46);

        // 下三分之一读数条
        tl.fromTo('#b3-lower', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.62);
        tl.fromTo(
          '#b3-metric-main',
          { scale: 0.72, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.8)' },
          0.86,
        );
        tl.fromTo('#b3-metric-base', { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 0.9);
        tl.fromTo(
          '#b3-metric-sim',
          { opacity: 0, scale: 1.3 },
          { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' },
          1.32,
        );
        tl.fromTo(
          '#b3-delta',
          { opacity: 0, scale: 1.3 },
          { opacity: 1, scale: 1, duration: 0.45, ease: 'power3.out' },
          2.63,
        );
        tl.fromTo(
          '#b3-latency',
          { clipPath: 'inset(0 100% 0 0)' },
          { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'power2.out' },
          2.1,
        );

        // 中段持续运动：两半截图反向轻微对推 + 缓慢放大（父层负责位移，子层负责缩放）
        tl.fromTo('#b3-pan-left', { x: 0 }, { x: -26, duration: 4.98, ease: 'none' }, 0);
        tl.fromTo('#b3-pan-right', { x: 0 }, { x: 26, duration: 4.98, ease: 'none' }, 0);
        tl.fromTo('#b3-img-left', { scale: 1 }, { scale: 1.05, duration: 4.98, ease: 'none' }, 0);
        tl.fromTo('#b3-img-right', { scale: 1 }, { scale: 1.05, duration: 4.98, ease: 'none' }, 0);
        // 用 to 而不是第二个 fromTo：同一元素上叠两个 fromTo 会让 resting state 取决于
        // 后写的那条 tweens 的 from 值（linter: gsap_repeated_fromto_without_baseline）。
        tl.to('#b3-divider-node', { boxShadow: '0 0 24px 8px rgba(197,212,175,0.28)', duration: 2.2, ease: 'sine.inOut' }, 0.8);
        tl.to('#b3-metric-sim', { opacity: 0.72, duration: 1.0, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 3.2);

        // 退场：速度匹配上移，与下一镜交接（本地 4.58 → 4.98）
        tl.to(
          '#b3-scene',
          { y: -160, filter: 'blur(28px)', opacity: 0, duration: 0.4, ease: 'power2.in' },
          4.58,
        );

        window.__timelines['beat-3-proof'] = tl;
        tl.seek(0);
      </script>
    </div>
  </body>
</html>
