<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>禾衡系统总体架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f7f6f0;
      font-family: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      color: #1f2f2a;
    }
    svg { display: block; width: 960px; height: auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 736" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="arch-title arch-desc">
    <title id="arch-title">禾衡系统总体架构</title>
    <desc id="arch-desc">系统按数据层、算法层、应用层、展示层四层组织：省级与县级两级面板进入互补归因模型，经多协议验证后由统一 REST API 提供八个决策模块使用。</desc>
    <defs>
      <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#5a6b61"/>
      </marker>
    </defs>

    <rect width="960" height="736" fill="#f7f6f0"/>

    <!-- layer rail -->
    <line x1="112" y1="40" x2="112" y2="680" stroke="rgba(31,47,42,0.18)" stroke-width="0.8"/>
    <line x1="104" y1="40" x2="120" y2="40" stroke="rgba(31,47,42,0.18)" stroke-width="0.8"/>
    <line x1="104" y1="208" x2="120" y2="208" stroke="rgba(31,47,42,0.18)" stroke-width="0.8"/>
    <line x1="104" y1="408" x2="120" y2="408" stroke="rgba(31,47,42,0.18)" stroke-width="0.8"/>
    <line x1="104" y1="544" x2="120" y2="544" stroke="rgba(31,47,42,0.18)" stroke-width="0.8"/>
    <line x1="104" y1="680" x2="120" y2="680" stroke="rgba(31,47,42,0.18)" stroke-width="0.8"/>

    <text x="24" y="104" fill="#8a968d" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
    <text x="24" y="136" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">数据层</text>
    <text x="24" y="280" fill="#8a968d" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
    <text x="24" y="312" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">算法层</text>
    <text x="24" y="448" fill="#8a968d" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03</text>
    <text x="24" y="480" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">应用层</text>
    <text x="24" y="600" fill="#8a968d" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">04</text>
    <text x="24" y="632" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">展示层</text>

    <!-- connectors -->
    <line x1="528" y1="176" x2="528" y2="208" stroke="#5a6b61" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <line x1="528" y1="376" x2="528" y2="408" stroke="#5a6b61" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <line x1="528" y1="512" x2="528" y2="544" stroke="#5a6b61" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

    <!-- data layer panel -->
    <rect x="128" y="56" width="800" height="120" rx="6" fill="#ffffff" stroke="#1f2f2a" stroke-width="1"/>
    <text x="912" y="76" text-anchor="end" fill="#5a6b61" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">异构数据 → 两级平衡面板</text>
    <line x1="528" y1="72" x2="528" y2="160" stroke="rgba(31,47,42,0.12)" stroke-width="0.8"/>

    <text x="144" y="104" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">省级面板</text>
    <text x="144" y="132" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">31 省 × 13 年 = 403 样本</text>
    <text x="144" y="156" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">11 维入模 · 统计 / 气象 / 遥感 / 灾情</text>

    <text x="544" y="104" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">县级面板</text>
    <text x="544" y="132" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">10 主产省 · 1,199 县 × 12 年</text>
    <text x="544" y="156" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">14,388 样本 · 16 维纯气候</text>

    <!-- algorithm layer panel -->
    <rect x="128" y="208" width="800" height="168" rx="6" fill="#ffffff" stroke="#1f2f2a" stroke-width="1"/>
    <text x="912" y="228" text-anchor="end" fill="#5a6b61" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">互补归因 + 多协议验证</text>
    <line x1="528" y1="224" x2="528" y2="312" stroke="rgba(31,47,42,0.12)" stroke-width="0.8"/>

    <text x="144" y="252" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">省级互补归因</text>
    <text x="144" y="280" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">XGBoost-SHAP · LSTM</text>
    <text x="144" y="304" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">Attention-LSTM · 双视角对照</text>

    <text x="544" y="252" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">县级气候归因</text>
    <text x="544" y="280" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">CLIMG-XGB + SHAP</text>
    <text x="544" y="304" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">LCO R² +0.4489 · 时间外推 +0.3644</text>
    <rect x="536" y="248" width="4" height="72" rx="2" fill="#6f8c5c"/>

    <rect x="144" y="328" width="768" height="32" rx="4" fill="rgba(31,47,42,0.05)" stroke="rgba(31,47,42,0.10)" stroke-width="0.8"/>
    <text x="160" y="348" fill="#1f2f2a" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">验证与稳健性</text>
    <text x="288" y="348" fill="#5a6b61" font-size="16" font-family="'Geist Mono', 'Noto Sans SC', monospace">random 8:2 · LCO · 时间外推 · null 检验 · bootstrap</text>

    <!-- application layer panel -->
    <rect x="128" y="408" width="800" height="104" rx="6" fill="#ffffff" stroke="#1f2f2a" stroke-width="1"/>
    <text x="912" y="420" text-anchor="end" fill="#5a6b61" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">统一推理与结果服务</text>

    <text x="144" y="452" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">Flask REST API</text>
    <text x="144" y="480" fill="#5a6b61" font-size="16" font-family="'Geist Mono', 'Noto Sans SC', monospace">/api/predict · /api/counties* · /api/rag</text>

    <rect x="688" y="424" width="224" height="72" rx="4" fill="rgba(31,47,42,0.05)" stroke="#5a6b61" stroke-width="0.8"/>
    <text x="800" y="452" text-anchor="middle" fill="#1f2f2a" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">模型与归因产物</text>
    <text x="800" y="476" text-anchor="middle" fill="#5a6b61" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">SHAP 值 · 面板缓存</text>

    <!-- presentation layer panel -->
    <rect x="128" y="544" width="800" height="136" rx="6" fill="rgba(31,47,42,0.03)" stroke="rgba(31,47,42,0.30)" stroke-width="1"/>
    <text x="912" y="564" text-anchor="end" fill="#5a6b61" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">八模块科研决策界面</text>
    <line x1="528" y1="560" x2="528" y2="656" stroke="rgba(31,47,42,0.12)" stroke-width="0.8"/>

    <text x="144" y="588" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">省级决策视图</text>
    <text x="144" y="616" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">M00 总览 · M01 风险地图 · M02 SHAP</text>
    <text x="144" y="640" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">M03 情景模拟 · M04 韧性路径</text>

    <text x="544" y="588" fill="#1f2f2a" font-size="20" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">县级诊断与辅助</text>
    <text x="544" y="616" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">M07 县级地图 · M05 推演监控</text>
    <text x="544" y="640" fill="#5a6b61" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">M06 知识助手</text>

    <text x="128" y="712" fill="#8a968d" font-size="16" font-family="'Geist', 'Noto Sans SC', sans-serif">口径：省级 11 维入模；县级 16 维纯气候，排除播种面积与省-年常量。两级结果不可直接比较或相加。</text>
  </svg>
</body>
</html>
